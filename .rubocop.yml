plugins:
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "tmp/**/*"
    - "templates/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics:
  Enabled: false

# server_context is part of the Tool.call interface even when unused by an implementation
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
